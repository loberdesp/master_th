[project]
name = "master-th"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "loberdesp", email = "siembab04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "auraloss>=0.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
]

[project.scripts]
master-th = "master_th:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# Torch comes from the CPU-only PyTorch index (no NVIDIA GPU locally; CI is CPU).
# To use CUDA later, point these sources at e.g. https://download.pytorch.org/whl/cu130.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "gpu: tests that require a CUDA GPU",
    "hardware: tests that require the STM32 board or other hardware",
]

[tool.coverage.run]
source = ["master_th"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
